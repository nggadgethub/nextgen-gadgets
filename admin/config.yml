backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Product Name"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Price"
        name: "price"
        widget: "string"

      - label: "Image"
        name: "image"
        widget: "image"

      - label: "Affiliate Link"
        name: "affiliate_link"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "string"
